aid: vaas
name: Vaas
description: Vaas is a Colombian fintech building debt infrastructure for Latin America,
  operating a platform that automates asset-backed debt facilities for originators,
  asset managers, and debt providers across industries. Vaas autonomously verifies
  asset documentation, reconciles cash flows end to end, and enforces collateral
  ownership in real time so assets cannot be pledged twice, bringing liquidity and
  transparency to private credit. Backed by Andreessen Horowitz (a16z). Vaas does
  not currently publish a public API or developer portal.
